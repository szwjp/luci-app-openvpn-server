name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SDK_DIR: ${{ github.workspace }}/../sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86-64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd time

      - name: Download and extract ImmortalWrt SDK
        run: |
          SDK=immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64
          wget -q "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/${SDK}.tar.zst"
          tar -I 'zstd -T0' -xf "${SDK}.tar.zst"
          mv "$SDK" "$SDK_DIR"

      - name: Prepare feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Overlay this package into the luci feed
        run: |
          DEST="$SDK_DIR/feeds/luci/applications/luci-app-openvpn-server"
          mkdir -p "$DEST"
          # 清空上游同名包，用本仓库代码完整替换（源为 checkout，不含 sdk）
          find "$DEST" -mindepth 1 -delete
          rsync -a --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE"/ "$DEST"/
          ls -la "$DEST"

      - name: Configure
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cat <<EOF >> .config
          CONFIG_PACKAGE_luci-app-openvpn-server=m
          CONFIG_PACKAGE_luci-i18n-openvpn-server-zh-cn=m
          EOF
          make defconfig

      - name: Compile packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          # 主软件包
          make package/luci-app-openvpn-server/compile V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          # 中文翻译包（独立 apk）
          make package/luci-i18n-openvpn-server-zh-cn/compile V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Collect packages
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$SDK_DIR/bin" \( -name 'luci-app-openvpn-server*' -o -name 'luci-i18n-openvpn-server*' \) -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openvpn-server-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/out/
            ${{ github.workspace }}/build.log

  image-test:
    needs: build
    runs-on: ubuntu-24.04
    env:
      IB_DIR: ${{ github.workspace }}/../ib
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd tar wget file

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-openvpn-server-x86-64
          path: pkg

      - name: Download and extract ImmortalWrt ImageBuilder
        run: |
          IB=immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64
          wget -q "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/${IB}.tar.zst"
          tar -I 'zstd -T0' -xf "${IB}.tar.zst"
          mv "$IB" "$IB_DIR"

      - name: Build image (openvpn-openssl + luci-app-openvpn-server)
        run: |
          # 将自编译的主包与中文翻译包 apk 放入 ImageBuilder 本地包目录
          cp pkg/out/luci-app-openvpn-server-*.apk "$IB_DIR/packages/"
          cp pkg/out/luci-i18n-openvpn-server-*.apk "$IB_DIR/packages/"
          ls -l "$IB_DIR/packages/" | grep openvpn-server
          cd "$IB_DIR"
          # 同时选中 openvpn-openssl 与本包（含翻译），触发 apk 文件归属冲突检查
          make image \
            PACKAGES="luci-nginx luci-app-openvpn-server luci-i18n-openvpn-server-zh-cn openvpn-openssl openvpn-easy-rsa kmod-tun" \
            BIN_DIR=bin 2>&1 | tee "$GITHUB_WORKSPACE/image.log"

      - name: Upload image build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-log
          path: ${{ github.workspace }}/image.log
