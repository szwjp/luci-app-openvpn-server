name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新的推送自动取消旧的运行，避免堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v4

      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Validate syntax and firewall logic
        run: |
          sh -n root/etc/uci-defaults/openvpn-server
          bash -n .github/build-pkg.sh
          luac5.1 -p luasrc/model/cbi/openvpn-server/openvpn-server.lua
          luac5.1 -p luasrc/controller/openvpn-server.lua
          sh .github/tests/test-uci-defaults.sh

      - name: Build packages (apk + ipk)
        run: |
          fakeroot bash .github/build-pkg.sh apk "${{ github.run_number }}"
          fakeroot bash .github/build-pkg.sh ipk "${{ github.run_number }}"
          ls -l .github/*.apk .github/*.ipk

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-server-packages
          include-hidden-files: true
          path: |
            .github/*.apk
            .github/*.ipk

      - name: Cleanup old release and tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 删除旧的 release（连同其 assets）与 tag，让 publish 步骤在当次 commit 上重新创建 tag，
          # 从而刷新 release 时间戳，并避免 action-gh-release 因 tag 已存在而不推进到最新提交。
          # 首次运行（或 release/tag 不存在）时 curl 404 属预期，用 `|| RELEASE_ID=""` 兜底。
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/luci-app-openvpn-server" | jq -r '.id' 2>/dev/null) || RELEASE_ID=""
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
              || echo "::warning::删除旧 release $RELEASE_ID 失败，继续"
          fi
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/luci-app-openvpn-server" \
            || echo "::warning::tag luci-app-openvpn-server 不存在或删除失败，继续"

      - name: Publish to Latest Build Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luci-app-openvpn-server
          name: OpenVPN Server Latest Build
          body: |
            Automatically built on ${{ github.run_id }}.
            Commit: ${{ github.sha }}
          files: |
            .github/luci-app-openvpn-server-*.apk
            .github/luci-app-openvpn-server-*.ipk
            .github/luci-i18n-openvpn-server-zh-cn-*.apk
            .github/luci-i18n-openvpn-server-zh-cn-*.ipk
          token: ${{ github.token }}
