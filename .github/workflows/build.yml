name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新的推送自动取消旧的运行，避免堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v4

      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Build packages (apk + ipk)
        run: |
          fakeroot bash .github/build-pkg.sh apk "${{ github.event_name }}"
          fakeroot bash .github/build-pkg.sh ipk "${{ github.event_name }}"
          ls -l .github/*.apk .github/*.ipk

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-server-packages
          include-hidden-files: true
          path: |
            .github/*.apk
            .github/*.ipk

  image-test:
    needs: build
    runs-on: ubuntu-latest
    env:
      IB_DIR: ${{ github.workspace }}/../ib
    steps:
      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Install host dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd tar wget file meson ninja-build libssl-dev lua5.1

      - name: Build apk-tools (for repository indexing)
        run: |
          pushd apk-tools
          meson setup build \
            -Db_lto=true -Dcompressed-help=false -Ddocs=disabled -Dhelp=enabled \
            -Dlua_version=5.1 -Ddefault_library=static -Durl_backend=wget \
            -Dzstd=false -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C build
          sudo meson install -C build --strip
          popd
          apk --version

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvpn-server-packages
          path: pkg

      - name: Download and extract ImmortalWrt ImageBuilder
        run: |
          IB=immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64
          wget -q "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/${IB}.tar.zst"
          tar -I 'zstd -T0' -xf "${IB}.tar.zst"
          mv "$IB" "$IB_DIR"

      - name: Prepare local package repository
        run: |
          set -eo pipefail
          # 1) 拷入自编译的主包与翻译包
          find pkg -name 'luci-app-openvpn-server_*.apk' -exec cp -v {} "$IB_DIR/packages/" \;
          find pkg -name 'luci-i18n-openvpn-server-zh-cn_*.apk' -exec cp -v {} "$IB_DIR/packages/" \;
          # 2) 为本地包目录生成 apk 索引 packages.adb
          apk mkidx --output "$IB_DIR/packages/packages.adb" "$IB_DIR/packages/"*.apk
          # 3) 修复 repositories：released 25.12.1 写的是相对路径 packages/packages.adb，
          #    新版 apk 不识别（openwrt#18032），改为绝对路径
          sed -i "s|^packages/packages.adb$|$IB_DIR/packages/packages.adb|" "$IB_DIR/repositories"
          grep -n 'packages.adb' "$IB_DIR/repositories"
          # 4) 关闭签名校验，接受未签名的自编译包（apk 会加 --allow-untrusted）
          sed -i 's/^CONFIG_SIGNATURE_CHECK=y.*/# CONFIG_SIGNATURE_CHECK is not set/' "$IB_DIR/.config"

      - name: Build image (openvpn-openssl + luci-app-openvpn-server)
        run: |
          set -eo pipefail
          cd "$IB_DIR"
          # 同时选中 openvpn-openssl 与本包（含翻译），触发 apk 文件归属冲突检查
          make image \
            PACKAGES="luci-nginx luci-app-openvpn-server luci-i18n-openvpn-server-zh-cn openvpn-openssl openvpn-easy-rsa kmod-tun" \
            BIN_DIR=bin 2>&1 | tee "$GITHUB_WORKSPACE/image.log"

      - name: Upload image build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-log
          path: ${{ github.workspace }}/image.log
