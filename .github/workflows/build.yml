name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86-64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd time

      - name: Download and extract ImmortalWrt SDK
        run: |
          SDK=immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64
          wget -q "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/${SDK}.tar.zst"
          tar -I 'zstd -T0' -xf "${SDK}.tar.zst"
          mv "$SDK" sdk

      - name: Prepare feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Overlay this package into the luci feed
        run: |
          DEST=sdk/feeds/luci/applications/luci-app-openvpn-server
          mkdir -p "$DEST"
          # 清空上游同名包，用本仓库代码完整替换
          find "$DEST" -mindepth 1 -delete
          rsync -a --exclude='.git' --exclude='.github' ./ "$DEST"/
          ls -la "$DEST"

      - name: Configure
        working-directory: sdk
        run: |
          cat <<EOF >> .config
          CONFIG_PACKAGE_luci-app-openvpn-server=m
          EOF
          make defconfig

      - name: Compile package
        working-directory: sdk
        run: |
          make package/luci-app-openvpn-server/compile V=s 2>&1 | tee build.log

      - name: Collect packages
        if: always()
        run: |
          mkdir -p out
          find sdk/bin -name 'luci-app-openvpn-server*' -exec cp -v {} out/ \;

      - name: Upload package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openvpn-server-${{ matrix.target }}
          path: |
            out/
            sdk/build.log
