name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新的推送自动取消旧的运行，避免堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # ★ 与 ImmortalWrt master 的 apk 版本对齐，勿随意升级
  APK_TOOLS_REF: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'
  # ipkg-build 固定到具体 commit，避免 master 前进导致构建产物漂移
  IPKG_BUILD_REF: '7b46f9593eb92c80541dde12b6e49f1761f9c7be'
  # 官方包仓库。必须用 downloads.immortalwrt.org：USTC 的 immortalwrt 镜像目录
  # 里没有 openvpn-openssl / openvpn-easy-rsa（只有 openvpn-mbedtls），
  # clash-check 会因找不到依赖包而失败。路径只取 packages/x86_64/packages 这一条。
  DEPS_BASE_URL: 'https://downloads.immortalwrt.org/releases/25.12.2/packages/x86_64/packages'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v4

      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: ${{ env.APK_TOOLS_REF }}

      - name: Checkout po2lmo
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/${{ env.IPKG_BUILD_REF }}/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Validate syntax and firewall logic
        run: |
          sh -n root/etc/uci-defaults/openvpn-server
          sh -n root/etc/openvpn/genovpn.sh
          sh -n root/etc/openvpn/renewcert.sh
          sh -n root/etc/init.d/openvpn-server
          bash -n .github/build-pkg.sh
          luac5.1 -p luasrc/model/cbi/openvpn-server/openvpn-server.lua
          luac5.1 -p luasrc/controller/openvpn-server.lua
          sh .github/tests/test-uci-defaults.sh
          sh .github/tests/test-init-conf.sh
          sh .github/tests/test-luci-api.sh

      - name: Verify version consistency
        id: version
        run: |
          set -eo pipefail
          VERSION="$(awk -F':=' '/^PKG_VERSION:=/{print $2}' Makefile | xargs)"
          RELEASE="$(awk -F':=' '/^PKG_RELEASE:=/{print $2}' Makefile | xargs)"
          [ -n "$VERSION" ] || { echo "::error::Makefile 未定义 PKG_VERSION"; exit 1; }
          [ -n "$RELEASE" ] || { echo "::error::Makefile 未定义 PKG_RELEASE"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build packages (apk + ipk)
        run: |
          fakeroot bash .github/build-pkg.sh apk "${{ github.run_number }}"
          fakeroot bash .github/build-pkg.sh ipk "${{ github.run_number }}"
          ls -l .github/*.apk .github/*.ipk

      - name: Verify artifact names match the version
        run: |
          set -eo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          RELEASE="${{ steps.version.outputs.RELEASE }}"
          # apk v3 的版本串是 <version>-r<release>，ipkg-build 的是 <version>-<release>（无 r 前缀）
          EXPECTED_APK="luci-app-openvpn-server-${VERSION}-r${RELEASE}"
          EXPECTED_IPK="luci-app-openvpn-server-${VERSION}-${RELEASE}"
          for f in .github/luci-app-openvpn-server-*.apk .github/luci-app-openvpn-server-*.ipk; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              "$EXPECTED_APK".apk) ;;
              "$EXPECTED_IPK".ipk) ;;
              *) echo "::error::产物名与 Makefile 版本不一致：$base（期望 $EXPECTED_APK.apk 或 $EXPECTED_IPK.ipk）"; exit 1 ;;
            esac
          done
          I18N_APK="luci-i18n-openvpn-server-zh-cn-${VERSION}-r${RELEASE}"
          I18N_IPK="luci-i18n-openvpn-server-zh-cn-${VERSION}-${RELEASE}"
          for f in .github/luci-i18n-openvpn-server-zh-cn-*.apk .github/luci-i18n-openvpn-server-zh-cn-*.ipk; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              "$I18N_APK".apk) ;;
              "$I18N_IPK".ipk) ;;
              *) echo "::error::翻译包产物名与 Makefile 版本不一致：$base（期望 $I18N_APK.apk 或 $I18N_IPK.ipk）"; exit 1 ;;
            esac
          done
          echo "产物名与版本一致：apk=$EXPECTED_APK apk / ipk=$EXPECTED_IPK ipk"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-server-packages
          include-hidden-files: true
          path: |
            .github/*.apk
            .github/*.ipk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          # 每个版本一个 release，保留历史；同一版本重复构建只更新资产。
          # tag 与 Makefile 的 PKG_VERSION/PKG_RELEASE 一一对应。
          tag_name: v${{ steps.version.outputs.VERSION }}-r${{ steps.version.outputs.RELEASE }}
          name: OpenVPN Server ${{ steps.version.outputs.VERSION }}-r${{ steps.version.outputs.RELEASE }}
          body: |
            Automatically built on ${{ github.run_id }}.
            Commit: ${{ github.sha }}
          files: |
            .github/luci-app-openvpn-server-*.apk
            .github/luci-app-openvpn-server-*.ipk
            .github/luci-i18n-openvpn-server-zh-cn-*.apk
            .github/luci-i18n-openvpn-server-zh-cn-*.ipk
          token: ${{ github.token }}

  # 文件归属冲突校验：本包与硬依赖 openvpn-openssl / openvpn-easy-rsa
  # 不能拥有同名文件，否则封装固件镜像时会报 "trying to overwrite"。
  # （历史上正是 /etc/config/openvpn 撞车导致本包无法封装。）
  clash-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apk-tools
        uses: actions/checkout@v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: ${{ env.APK_TOOLS_REF }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build libssl-dev lua5.1

      - name: Build apk-tools
        run: |
          pushd apk-tools
          meson setup build \
            -Db_lto=true -Dcompressed-help=false -Ddocs=disabled -Dhelp=enabled \
            -Dlua_version=5.1 -Ddefault_library=static -Durl_backend=wget \
            -Dzstd=false -Dpython=disabled -Dtests=disabled -Dcrypto_backend=openssl
          ninja -C build
          sudo meson install -C build --strip
          popd
          apk --version

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: openvpn-server-packages
          path: pkg

      - name: Fetch dependency packages
        run: |
          set -eo pipefail
          mkdir -p deps && cd deps
          for p in openvpn-openssl openvpn-easy-rsa; do
            # 注意：正则里的 " 必须写成 \"。直接写 [^"<>] 会提前闭合外层双引号，
            # 报 "syntax error near unexpected token `done'"。
            pattern="${p}-[0-9][^\"<>]*\.apk"
            f="$(curl -fsSL "${DEPS_BASE_URL}/" | grep -oE "$pattern" | head -n1)"
            [ -n "$f" ] || { echo "未在仓库找到 $p"; exit 1; }
            echo "fetching $f"
            curl -fsSLO "${DEPS_BASE_URL}/$f"
            mv "$f" "${p}.apk"
          done
          ls -l

      - name: Check file ownership clashes
        run: |
          set -eo pipefail
          extract_list() {
            local apkfile="$1" out="$2" dir
            dir="$(mktemp -d)"
            apk extract --allow-untrusted --no-chown --destination "$dir" "$apkfile"
            ( cd "$dir" && find . \( -type f -o -type l \) ! -path './lib/apk/packages/*' \
                | sed 's|^\./|/|' | sort ) > "$out"
            rm -rf "$dir"
          }

          extract_list "$(ls pkg/luci-app-openvpn-server-*.apk)" ours-app.txt
          extract_list "$(ls pkg/luci-i18n-openvpn-server-zh-cn-*.apk)" ours-i18n.txt
          extract_list deps/openvpn-openssl.apk dep-openssl.txt
          extract_list deps/openvpn-easy-rsa.apk dep-easyrsa.txt

          echo "=== 本包文件数 ==="; wc -l ours-app.txt ours-i18n.txt
          echo "=== 依赖文件数 ==="; wc -l dep-openssl.txt dep-easyrsa.txt

          fail=0
          for pair in "ours-app.txt dep-openssl.txt" "ours-app.txt dep-easyrsa.txt" "ours-i18n.txt dep-openssl.txt" "ours-i18n.txt dep-easyrsa.txt"; do
            set -- $pair
            echo "=== 冲突检查: $1 vs $2 ==="
            if comm -12 "$1" "$2" | tee /dev/stderr | grep -q .; then
              echo "ERROR: $1 与 $2 存在相同归属文件（封装镜像会冲突）"
              fail=1
            else
              echo "OK: 无冲突"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Upload clash-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clash-check-report
          path: |
            ours-app.txt
            ours-i18n.txt
            dep-openssl.txt
            dep-easyrsa.txt
